name: Deploy word-search

# Vercel-style "push to main -> it's live" but self-hosted.
# The build happens ON the VPS (no external image registry):
# checkout -> SSH -> git pull -> docker build -> up.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/word-search
            bash deploy.sh
